seed: 0
sim:
  timestep: 0.002
  control_dt: 0.01
  episode_seconds: 6.0
  floor_friction: 1.0
  joint_damping: 0.5
subject:
  height: 1.75
  mass: 75.0
payload:
  enabled: true
  mass: 11.34
  offset:
  - -0.12
  - 0.0
  - 0.2
exo_hardware:
  enabled: true
  spec: configs/exo_mk1.yaml
  quality: lo
tasks:
  names:
  - squat
  - high_knees
  - quick_steps
  - backward_walk
  - walk
  data_dir: null
  circuit_prob: 0.3
  circuit_segment_seconds:
  - 2.0
  - 3.5
  circuit_order: random
  ace_order:
  - squat
  - high_knees
  - quick_steps
  - backward_walk
  forbidden_transitions:
  - - backward_walk
    - walk
  blend_seconds: 0.5
human:
  kp:
    hip: 800
    knee: 800
    ankle: 600
  kd:
    hip: 60
    knee: 50
    ankle: 30
  ki:
    hip: 1200
    knee: 1200
    ankle: 800
  integral_limit_frac: 0.5
  max_torque:
    hip: 180
    knee: 180
    ankle: 150
  exo_adaptation: 1.0
  residual:
    x_kv: 500
    pitch_kp: 2000
    pitch_kd: 200
exo:
  joints:
  - hip_l
  - knee_l
  - hip_r
  - knee_r
  max_torque:
  - 40
  - 40
  - 40
  - 40
  action_scale:
  - 40
  - 40
  - 40
  - 40
  rate_limit: 1500
  direction:
  - both
  - both
  - both
  - both
  feedforward: limb_gravity
  alpha: 0.0
observation:
  history: 8
  use_phase: true
  include_prev_action: true
reward:
  alive: 2.0
  w_effort: 2.0
  w_tracking: 0.3
  tracking_sigma_deg: 10
  w_smooth: 0.5
  w_magnitude: 0.05
termination:
  max_joint_error_deg: 45
  min_pelvis_height_frac: 0.5
randomization:
  enabled: true
  height:
  - 1.6
  - 1.9
  mass:
  - 55.0
  - 95.0
  payload_mass_scale:
  - 0.95
  - 1.05
  payload_offset_m: 0.03
  floor_friction:
  - 0.7
  - 1.2
  joint_damping_scale:
  - 0.7
  - 1.3
  human_gain_scale:
  - 0.8
  - 1.2
  exo_adaptation:
  - 0.6
  - 1.0
  latency_steps:
  - 0
  - 2
  torque_noise_frac: 0.05
  exo_mass_scale:
  - 0.95
  - 1.05
  sensor_noise:
    angle: 0.005
    velocity: 0.05
    gyro: 0.05
    accel: 0.2
agent:
  algo: td3
  hidden:
  - 256
  - 256
  actor_lr: 0.0003
  critic_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_size: 100000
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  expl_noise: 0.1
train:
  total_steps: 75000
  start_steps: 5000
  eval_every: 10000
  eval_episodes: 1
  save_every: 75000
  device: auto
