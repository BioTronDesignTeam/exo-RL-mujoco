# Runs on every pull request and every push to main. A PR should only be merged when
# this passes (make it a required check: Settings -> Branches/Rules -> require "tests").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:                      # a new push to the same PR cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04          # pinned so a runner image change cannot alter results
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyflakes

      - name: Lint (unused imports / undefined names)
        run: python -m pyflakes exo_rl scripts deploy tests

      - name: Tests
        run: python -m pytest -q --durations=10
