  joints:
  - hip_l
  - knee_l
  - hip_r
  - knee_r
  max_torque:
  - 40.0
  - 40.0
  - 40.0
  - 40.0
  action_scale:
  - 40.0
  - 40.0
  - 40.0
  - 40.0
  rate_limit: 1500
  direction:
  - both
  - both
  - both
  - both
  feedforward: limb_gravity
  alpha: 0.0
  smoothing_seconds: 0.15
