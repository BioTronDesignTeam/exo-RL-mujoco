# Independent pelvis/lumbar posture; ideal bounded lumbar helper, not upper-body muscles.
seed: 0
sim:
  timestep: 0.001
  control_dt: 0.01
  episode_seconds: 20.0
  floor_friction: 1.0
  joint_damping: 0.5
  diagnostics: true
  flat_ground: true
subject:
  height: 1.75
  mass: 78.09046847904192
payload:
  enabled: true
  mass: 25.0
  offset:
  - -0.18
  - 0.0
  - 0.22
exo_hardware:
  enabled: true
  spec: configs/exo_mk1.yaml
  quality: lo
  mass_scale: 1.0
tasks:
  names:
  - high_knees
  data_dir: data/motions/myolegs26_torso_v2
  extra_motions: []
  circuit_prob: 0.0
  circuit_segment_seconds:
  - 2.0
  - 3.5
  circuit_order: random
  ace_order:
  - high_knees
  forbidden_transitions:
  - - backward_walk
    - walk
  blend_seconds: 0.5
  periods: {}
  startup_seconds: 2.0
human:
  kp:
    hip: 1500
    knee: 1500
    ankle: 1500
  kd:
    hip: 100
    knee: 100
    ankle: 100
  ki:
    hip: 1500
    knee: 1500
    ankle: 1500
  integral_limit_frac: 0.5
  max_torque:
    hip: 180
    knee: 180
    ankle: 150
  exo_adaptation: 1.0
  residual:
    x_kv: 500
    pitch_kp: 4000
    pitch_kd: 400
    pitch_ki: 1000
    pitch_integral_limit: 200
  model: myolegs26
  myo:
    source_dir: myo_sim
    ankle_dorsiflexion_deg: 45.0
    scale: 1.157625
    activation_regularization: 0.002
    foot_control:
      enabled: false
      toe_kp: 15.0
      toe_kd: 2.0
      toe_torque_limit: 15.0
      pitch_kp: 40.0
      pitch_kd: 4.0
      pitch_torque_limit: 20.0
      smoothing_seconds: 0.08
      torque_rate_limit: 100.0
      pitch_deadband_deg: 1.0
    standing_control:
      enabled: true
      transition_deg: 15.0
      stiffness_scale: 0.4
      integral_release_seconds: 0.5
    initialize_reference_velocity: true
    reset:
      start_phase: 0.0
      settle_seconds: 2.0
      height_jitter_m: 0.001
    torso_control:
      enabled: true
      pelvis_pitch_deg: 0.0
      pelvis_share: 0.0
      kp: 600.0
      kd: 60.0
      max_torque_Nm: 160.0
