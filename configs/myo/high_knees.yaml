  - 0.8
  - 1.2
  exo_adaptation:
  - 0.6
  - 1.0
  latency_steps:
  - 0
  - 2
  torque_noise_frac: 0.05
  exo_mass_scale:
  - 0.95
  - 1.05
  sensor_noise:
